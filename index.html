<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Список дел</title>
</head>

<body>  
<div class="container">
    <h2>Мои задачи</h2>

    <input type="text" id="taskInput" placeholder="Введите задачу">
    <button id="addBtn" onclick="addTask()">Добавить</button>

    <ul id="taskList"></ul>
</div>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef1f5;
            padding: 30px;
        }

        .container {
            width: 500px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        h2 {
            text-align: center;
            color: #333;
        }

        #taskInput {
            width: 70%;
            padding: 8px;
            font-size: 14px;
            border: 1px solid #aaa;
            border-radius: 4px;
        }

        #addBtn {
            padding: 8px 14px;
            font-size: 14px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        #addBtn:hover {
            background: #2563eb;
        }

        #taskList {
            list-style: none;
            padding: 0;
            margin-top: 20px;
        }

        #taskList li {
            display: flex;
            align-items: center;
            padding: 8px;
            border-bottom: 1px solid #eee;
        }

        #taskList li span {
            flex: 1;
            margin-left: 8px;
            font-size: 15px;
        }

        /* стиль для выполненной задачи */
        .done span {
            text-decoration: line-through;
            color: gray;
        }

        .del {
            background: none;
            border: none;
            color: red;
            font-size: 18px;
            cursor: pointer;
        }
    </style>
<script>
    // массив, где хранятся все задачи
    // каждая задача - это объект { text: "...", completed: false }
    var tasks = [];

    // функция добавления задачи
    function addTask() {
        var input = document.getElementById("taskInput");
        var text = input.value;

        // если поле пустое - ничего не делаем
        if (text.trim() == "") {
            alert("Введите задачу!");
            return;
        }

        // добавляем новую задачу в массив
        tasks.push({ text: text, completed: false });

        // очищаем поле ввода
        input.value = "";

        // обновляем список на странице
        showTasks();
    }

    // функция отрисовки списка задач
    function showTasks() {
        var list = document.getElementById("taskList");
        list.innerHTML = ""; // очищаем список перед перерисовкой

        // проходимся по всем задачам
        for (var i = 0; i < tasks.length; i++) {
            var task = tasks[i];

            // создаём элемент списка
            var li = document.createElement("li");

            // если задача выполнена - добавляем класс "done"
            if (task.completed == true) {
                li.className = "done";
            }

            // чекбокс для отметки выполнения
            var check = document.createElement("input");
            check.type = "checkbox";
            check.checked = task.completed;
            // используем замыкание через атрибут, чтобы запомнить индекс
            check.setAttribute("onchange", "toggleTask(" + i + ")");

            // текст задачи
            var span = document.createElement("span");
            span.innerText = task.text;

            // кнопка удаления
            var btn = document.createElement("button");
            btn.className = "del";
            btn.innerText = "×";
            btn.setAttribute("onclick", "deleteTask(" + i + ")");

            // собираем элемент
            li.appendChild(check);
            li.appendChild(span);
            li.appendChild(btn);

            // добавляем в список
            list.appendChild(li);
        }
    }

    // отметить задачу выполненной / невыполненной
    function toggleTask(index) {
        // меняем значение completed на противоположное
        if (tasks[index].completed == true) {
            tasks[index].completed = false;
        } else {
            tasks[index].completed = true;
        }
        showTasks();
    }

    // удалить задачу
    function deleteTask(index) {
        tasks.splice(index, 1); // удаляем 1 элемент по индексу
        showTasks();
    }

    // обработка нажатия Enter в поле ввода
    document.getElementById("taskInput").addEventListener("keydown", function (e) {
        if (e.key === "Enter") {
            addTask();
        }
    });
</script>

</body>
</html>
